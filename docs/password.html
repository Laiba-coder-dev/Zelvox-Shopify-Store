<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <title>Zelvox — Page not found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    >

    <style>
      :root {
    /* Surfaces */
    --bg: #FFFFFF;
    --bg-soft: #F7F6FA;
    --surface: #FFFFFF;
    --surface-2: #F3EEFF;
    --text: #242033;
    --text-muted: #777386;
    --border: #E7E3F2;

    /* Accents */
    --accent: #7545E8;
    --accent-2: #A478FF;
    --accent-contrast: #FFFFFF;
    --success: #1FA97A;
    --error: #D6455A;

    --grad-accent: linear-gradient(100deg, #7545E8 0%, #A478FF 100%);
    --grad-surface: linear-gradient(160deg, rgba(117,69,232,0.06), rgba(164,120,255,0.02));
    --grad-hero: linear-gradient(135deg, #FFFFFF 0%, #F7F4FF 45%, #F3EEFF 100%);

    /* Type */
    --font-heading: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    --text-base: 16px;
    --text-xs: 0.75rem;
    --text-sm: 0.85rem;
    --text-md: calc(var(--text-base) * 1.1);
    --text-lg: calc(var(--text-base) * 1.35);
    --text-xl: calc(var(--text-base) * 1.7);
    --text-2xl: calc(var(--text-base) * 2.15);
    --text-3xl: calc(var(--text-base) * 2.8);
    --text-4xl: calc(var(--text-base) * 3.6);

    --heading-weight: 700;
    --heading-transform: none;
    --btn-transform: none;

    /* Layout */
    --page-width: 1320px;
    --gutter: 24px;
    --section-space: 96px;
    --radius-card: 18px;
    --radius-btn: 12px;
    --radius-pill: 999px;

    /* Elevation — soft, tinted for light surfaces */
    --shadow-1: 0 1px 2px rgba(36, 32, 51, 0.06);
    --shadow-2: 0 14px 34px -14px rgba(36, 32, 51, 0.16);
    --shadow-3: 0 32px 70px -28px rgba(36, 32, 51, 0.22);
    --glow-accent: 0 18px 45px -18px rgba(117, 69, 232, 0.55);
    --ring-accent: 0 0 0 4px rgba(117, 69, 232, 0.18);

    /* Glass — light, subtle lavender tint */
    --glass-bg: rgba(255,255,255,0.72);
    --glass-border: rgba(36, 32, 51, 0.08);
    --glass-blur: 16px;

    --header-height: 72px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --dur: 280ms;

    
      /* Solid primary buttons: white text on the purple accent clears the WCAG
         4.5:1 contrast minimum (#7545E8 vs #FFFFFF ≈ 6.2:1). */
      --btn-bg: #7545E8;
      --btn-bg-hover: #A478FF;
      --btn-fg: #FFFFFF;
      --btn-fg-hover: #FFFFFF;
      --btn-border: #7545E8;
    
  }

    </style>
    <link rel="stylesheet" href="/Zelvox-Shopify-Store/assets/base.css">

    <script>
      document.documentElement.classList.remove('no-js');
      document.documentElement.classList.add('js');
    </script>

    <!-- content_for_header -->
  </head>

  <body class="template-password">
    <main id="MainContent" class="main-content password-layout" role="main">
      
<section class="section">
  <div class="container container--narrow password-page">
    <a class="site-header__logo password-page__logo" href="/Zelvox-Shopify-Store/">
      <span class="logo-mark" aria-hidden="true"><span class="logo-mark__glyph"></span></span>
      <span class="logo-wordmark">Zelvox</span>
    </a>

    <p class="eyebrow eyebrow--pill">Coming soon</p>
    <h1 class="page-title">Zelvox</h1>
    <p class="page-lede">This store is password protected. Enter the password to continue shopping.</p>

    <form method="post" action="/Zelvox-Shopify-Store/" accept-charset="UTF-8" data-form="storefront_password" class="password-form">
      <div class="password-form__row">
        <label class="visually-hidden" for="Password">Password</label>
        <input
          class="newsletter__input"
          id="Password"
          type="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >
        <button class="btn btn--primary" type="submit">Enter</button>
      </div></form>
  </div>
</section>

    </main>
    <script src="/Zelvox-Shopify-Store/assets/theme.js" defer></script>
  </body>
</html>
